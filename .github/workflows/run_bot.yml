name: X Bot Human

on:
  schedule:
    - cron: '*/45 * * * *' # Every 45 mins
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Cache Browser to speed up runs
      - name: Cache Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2
      
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Ensure Headless Shell
        run: python -m playwright install chromium

      # MEMORY HANDLING: Restore old memory, Save new memory at end
      - name: Bot Memory Cache
        uses: actions/cache@v4
        with:
          path: seen_posts.json
          # Using run_id ensures a UNIQUE key for saving this run's data
          key: ${{ runner.os }}-memory-${{ github.run_id }}
          # restore-keys finds the most recent cache with this prefix
          restore-keys: |
            ${{ runner.os }}-memory-

      - name: Run Bot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: python bot.py

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: ./*.png
          retention-days: 3
