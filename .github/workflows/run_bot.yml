name: X Bot Runner

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes
  workflow_dispatch:        # Allows manual run button

permissions:
  contents: write           # REQUIRED to save the memory file

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright fake-useragent httpx
          playwright install chromium

      - name: Run Bot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: python bot.py

      - name: Commit and Push Memory
        # This step saves 'seen_posts.json' back to the repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.json
          git commit -m "update: seen posts memory [skip ci]" || echo "No changes to commit"
          git push
