name: X Bot Auto-Reply

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour. Change to '*/30 * * * *' for every 30 mins.
  workflow_dispatch: # Allows you to run it manually with a button click.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for pulling changes correctly

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright fake-useragent httpx
          playwright install chromium

      - name: Run Bot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: python bot.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Stage the file that was changed by the bot
          git add seen_posts.json
          
          # 2. Commit it locally first
          git commit -m "update: seen posts memory [skip ci]" || echo "No changes to commit"
          
          # 3. Now pull the remote changes and put your commit on top
          # This will now work because your local 'seen_posts.json' is committed
          git pull --rebase origin main
          
          # 4. Push everything back to GitHub
          git push origin main
