name: X Sniper Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:      # Allows you to click "Run workflow" manually

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    # Important: Give the bot permission to write the 'seen_posts' file back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright httpx fake-useragent
          python -m playwright install chromium --with-deps

      - name: Run Sniper Bot
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python bot.py

      - name: Save Memory (seen_posts.json)
        run: |
          git config --global user.name "X-Sniper-Bot"
          git config --global user.email "actions@github.com"
          # Only commit if the file actually changed
          git add seen_posts.json
          git commit -m "Update memory: seen posts [skip ci]" || echo "No new posts to remember."
          git push

- name: Upload Debug Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-debug-screenshots
          path: ./*.png
