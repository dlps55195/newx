name: X Bot Human

on:
  schedule:
    - cron: '*/45 * * * *' # Runs approx every 45 mins
  workflow_dispatch:      # Allows manual trigger button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 1. Caches Python packages

      - name: Install Dependencies
        run: pip install playwright httpx fake-useragent

      # 2. Cache Playwright Browser (Saves ~2 mins)
      - name: Cache Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1
      
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Install Playwright deps (always needed)
        run: python -m playwright install-deps chromium

      # 3. Restore "Memory" (Prevents double posting)
      - name: Restore Bot Memory
        uses: actions/cache@v4
        with:
          path: seen_posts.json
          key: ${{ runner.os }}-memory-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-memory-

      - name: Run Bot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: python bot.py

      # 4. Upload Debug Screenshots (Only if something fails)
      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: ./*.png
          retention-days: 3
